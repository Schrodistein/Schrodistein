name: Aplicación de escritorio

# Compila los instaladores de Radar de Divisas en Windows, macOS y Linux.
# Cada ejecución deja los instaladores como artefactos descargables; al
# publicar una etiqueta v* (p. ej. v1.0.0) se crea además una versión
# (Release) con los instaladores adjuntos.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'trading/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Pruebas
        run: node tests/trading.js
      - name: Dependencias
        working-directory: desktop
        run: npm ci
      - name: Compilar instaladores
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # Sin certificado de firma: instaladores sin firmar.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Radar-de-Divisas-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      # Como las demás apps de escritorio del repositorio, se publica como prerelease.
      - uses: softprops/action-gh-release@v2
        with:
          name: Radar de Divisas ${{ github.ref_name }} (escritorio)
          prerelease: true
          files: instaladores/*
          body: |
            Aplicación de escritorio de **Radar de Divisas**: análisis técnico y cuantitativo de divisas y de Binance, con proyección del precio y avisos de entrada.

            ### Descarga
            | Sistema | Archivo |
            |---|---|
            | Windows (instalador) | `Radar-de-Divisas-*-win-x64.exe` |
            | Windows (portable, sin instalar) | `Radar-de-Divisas-*-portable.exe` |
            | macOS (Intel y Apple Silicon) | `Radar-de-Divisas-*-mac-universal.dmg` |
            | Linux | `Radar-de-Divisas-*-linux-x86_64.AppImage` |

            ### Primera apertura
            Los instaladores no están firmados:
            - **Windows**: si aparece SmartScreen, pulsa «Más información» → «Ejecutar de todas formas».
            - **macOS**: clic derecho sobre la app → «Abrir».
            - **Linux**: `chmod +x` al archivo `.AppImage` y ábrelo.

            ### Novedades de la versión de escritorio
            - Sigue en la bandeja del sistema al cerrar la ventana: el escáner y los avisos continúan.
            - Notificaciones del sistema que abren la ventana; opción «Iniciar con el sistema» (Windows y macOS).
            - Divisas reales (Twelve Data con clave gratuita, tipos diarios del BCE), calendario económico, sesiones, fuerza de las divisas y correlaciones.

            La app no envía órdenes ni accede a tu cuenta. Las señales son probabilísticas y no constituyen asesoramiento financiero.
