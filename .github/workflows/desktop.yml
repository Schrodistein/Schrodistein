name: Aplicación de escritorio

# Compila los instaladores de Radar de Divisas en Windows, macOS y Linux.
# Cada ejecución deja los instaladores como artefactos descargables; al
# publicar una etiqueta v* (p. ej. v1.0.0) se crea además una versión
# (Release) con los instaladores adjuntos.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'trading/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Pruebas
        run: node tests/trading.js
      - name: Dependencias
        working-directory: desktop
        run: npm ci
      - name: Compilar instaladores
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # Sin certificado de firma: instaladores sin firmar.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Radar-de-Divisas-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
