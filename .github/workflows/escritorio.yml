name: App de escritorio

on:
  push:
    branches: [claude/efficient-portfolio-confirmation-app-vjruny]
    paths:
      - 'escritorio/**'
      - 'portafolios/**'
      - '.github/workflows/escritorio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escritorio/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas
        run: npm test
      - name: Pruebas del motor de portafolios
        run: node ../portafolios/tests/run.js
      - name: Compilar instaladores
        run: node scripts/prepare.js && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: frontera-eficiente-${{ runner.os }}
          if-no-files-found: error
          path: |
            escritorio/dist/*.exe
            escritorio/dist/*.dmg
            escritorio/dist/*.AppImage
            escritorio/dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./escritorio/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: escritorio-v${{ steps.v.outputs.version }}
          name: Frontera Eficiente ${{ steps.v.outputs.version }} (escritorio)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: instaladores/*
          body: |
            Aplicación de escritorio de Frontera Eficiente, de Schrödistein: guía para aprender a operar acciones y ETF en la BVC conectada con la teoría; catálogo de todas las acciones y ETF de la BVC, con la BVC como única fuente de precios de acciones, índices y ETF; portafolios con los activos que elijas; paso a paso de la frontera eficiente, la CML, la SML, cada portafolio y el promedio de correlaciones; todas las matrices de cálculo en Excel y CSV; CSV en formato de Excel en español y matriz de precios en Excel (hoja «M. PRECIOS», una fila por rueda de la BVC, 242 al año; si un activo no se negoció, lleva su último precio cotizado); portafolios eficientes de Markowitz, Sharpe, Treynor y Jensen con acciones, renta fija, derivados y divisas de la Bolsa de Valores de Colombia; plan de inversión por presupuesto y horizonte con comisiones y montos mínimos; guía de dónde invertir; paso a paso de varianza, covarianza y correlación; beta de Sharpe frente a Damodaran; PIB, inflación, desempleo y TRM con su relación con la bolsa; sistema económico y financiero de Colombia e índices de la BVC; biblioteca local con todos los datos; datos y noticias que se actualizan solos cada semana.

            | Sistema | Archivo |
            | --- | --- |
            | Windows 10/11 (64 bits), con instalación | `Frontera-Eficiente-${{ steps.v.outputs.version }}-win-x64-instalador.exe` |
            | Windows 10/11 (64 bits), portátil (se abre sin instalar) | `Frontera-Eficiente-${{ steps.v.outputs.version }}-win-x64-portable.exe` |
            | macOS con chip Apple (M1 o posterior) | `…-mac-arm64.dmg` |
            | macOS con Intel | `…-mac-x64.dmg` |
            | Linux | `…-linux-x86_64.AppImage` o `…-linux-amd64.deb` |

            Cada archivo es la aplicación completa: se instala (o se abre, en la versión portátil) en cualquier equipo, sin necesitar una versión anterior. Para compartirla, envía el enlace de esta página o el archivo descargado. Los datos de cada equipo se pasan con «Exportar mis datos» e «Importar datos de otro equipo» en la sección Mercado.

            Los instaladores no están firmados con un certificado de desarrollador:
            - Windows muestra «Windows protegió su PC»: pulsa «Más información» y luego «Ejecutar de todas formas».
            - macOS bloquea la primera apertura: en Finder, clic derecho sobre la app → «Abrir» → «Abrir».
            - Linux (AppImage): dale permiso de ejecución (`chmod +x`) y ábrelo.
